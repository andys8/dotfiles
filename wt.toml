[post-start]
claude-settings = "[ -d '{{ primary_worktree_path }}/.claude' ] && mkdir -p .claude && [ -f '{{ primary_worktree_path }}/.claude/settings.local.json' ] && ln -sf '{{ primary_worktree_path }}/.claude/settings.local.json' .claude/settings.local.json || true"
# Sequenced (not parallel with the other post-start hooks): symlink generated files first so
# nci's postinstall sees a fresh file through the symlink and skips its own fetch, instead of
# racing to regenerate through it.
deps = """
for f in featureFlags.ts softwareCatalogTypes.ts; do [ -f '{{ primary_worktree_path }}/'$f ] && ln -sf '{{ primary_worktree_path }}/'$f $f; done 2>/dev/null || true
{ [ -f pnpm-lock.yaml ] || [ -f yarn.lock ] || [ -f package-lock.json ]; } && nci || true
"""

[commit]
stage = "all"

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[switch.picker]
pager = "cat"
